# Default VRAM Threshold in Megabytes (MB)
# GB10: 128 GB unified.
# Test soglia trigger: quando Dashboard ~120 GB, psutil.used ~112 GB (scarto 8 GB).
# Quindi threshold su psutil = 112000 -> trigger quando Dashboard ~120 GB.
threshold: 116000

# How often to check VRAM (in seconds)
interval: 5.0

# GPU Index to monitor (usually 0)
gpu_index: 0

# Test mode (True = only log without killing processes)
dry_run: false

# Protected Process IDs - these will NEVER be killed
whitelist_pids:
  - 1

# Protected process names (substring match). Never killed even if they consume the most memory.
# Add here long-running model servers, daemons, and critical services.
whitelist_names:
  - vram_guard
  - systemd
  - init
  - earlyoom

# Monitoring Mode
#   PROCESS - Kills specific processes exceeding the total
#   SYSTEM - Kills the largest process if total system VRAM usage exceeds threshold
mode: "SYSTEM"

# Enable automatic startup on boot (Windows / Linux)
autostart: false
